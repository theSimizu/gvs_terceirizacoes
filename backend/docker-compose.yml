services:
  mysql:
    image: mysql:8.0
    container_name: gvs_mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gvs_terceirizacoes}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gvs_backend
    env_file:
      - .env.example
    environment:
      PORT: ${PORT:-8080}
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/gvs_terceirizacoes?allowPublicKeyRetrieval=true&useSSL=false}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge

volumes:
  mysql_data:
